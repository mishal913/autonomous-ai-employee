name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18

        env:
          POSTGRES_DB: ai_employee
          POSTGRES_USER: ai_employee_user
          POSTGRES_PASSWORD: ci_postgres_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U ai_employee_user -d ai_employee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: ai_employee
      DB_USER: ai_employee_user
      DB_PASSWORD: ci_postgres_password

      # Safe dummy values for tests that mock external services.
      XKIRO_API_KEY: ci_dummy_key
      XKIRO_BASE_URL: https://example.invalid/v1
      XKIRO_MODEL: ci_dummy_model
      TAVILY_API_KEY: ci_dummy_key

      APP_JWT_SECRET: ci_only_jwt_secret_change_me
      APP_ADMIN_EMAIL: admin@example.com
      APP_ADMIN_PASSWORD: ci_admin_password
      AUTH_TOKEN_HOURS: "8"
      AUTH_COOKIE_SECURE: "false"

      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Enable pgvector extension
        env:
          PGPASSWORD: ci_postgres_password
        run: |
          psql \
            -h localhost \
            -U ai_employee_user \
            -d ai_employee \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run backend tests
        run: python -m pytest -q


  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build


  docker-backend-build:
    name: Backend Docker build
    runs-on: ubuntu-latest
    needs:
      - backend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t autonomous-ai-backend:ci .


  docker-frontend-build:
    name: Frontend Docker build
    runs-on: ubuntu-latest
    needs:
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=/api \
            -t autonomous-ai-frontend:ci \
            ./frontend
