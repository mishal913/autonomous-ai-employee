services:
  database:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: ai-employee-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_employee
      POSTGRES_USER: ai_employee_user
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - ai_employee_pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ai_employee_user -d ai_employee"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  init-backend:
    image: autonomous-ai-backend:stage5b

    env_file:
      - .env

    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ai_employee
      DB_USER: ai_employee_user
      DB_PASSWORD: ${DOCKER_POSTGRES_PASSWORD}

    depends_on:
      database:
        condition: service_healthy

    command:
      - python
      - -c
      - |
        from app.database import create_tables, test_connection
        from app.checkpoint import setup_checkpointer

        print("[INIT] Database:", test_connection())
        create_tables()
        print("[INIT] SQLAlchemy tables ready")
        setup_checkpointer()
        print("[INIT] LangGraph checkpoint tables ready")

    restart: "no"


  backend:
    image: autonomous-ai-backend:stage5b
    container_name: ai-employee-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ai_employee
      DB_USER: ai_employee_user
      DB_PASSWORD: ${DOCKER_POSTGRES_PASSWORD}
      PYTHONUNBUFFERED: "1"

    ports:
      - "8000:8000"

    volumes:
      - ./logs:/app/logs
      - ./knowledge/uploads:/app/knowledge/uploads
      - huggingface_cache:/app/.cache/huggingface

    depends_on:
      database:
        condition: service_healthy

      init-backend:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api

    container_name: ai-employee-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8080:80"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  ai_employee_pgdata:
    name: ai_employee_pgdata

  huggingface_cache:
    name: ai_employee_huggingface_cache
